packages:
  - 'apps/*'
  - 'packages/*'

# Allow build scripts for packages that require native compilation
# Required for: Prisma (generates client), argon2 (native hashing), esbuild (bundler)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
